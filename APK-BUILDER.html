<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kartar Classes APK Builder</title><style>body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;padding:24px;color:#06264d}.card{max-width:620px;margin:auto;background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 30px #0001}h1{margin-top:0}label{display:block;margin:16px 0 7px;font-weight:700}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #ccd5e2;font-size:16px}button{margin-top:18px;background:#06264d;color:#fff;border:0;cursor:pointer}.preview{display:flex;align-items:center;gap:12px;margin-top:18px;padding:12px;background:#f6f8fb;border-radius:12px}.preview img{width:72px;height:72px;object-fit:contain}.small{font-size:13px;color:#58677a;line-height:1.5}</style></head><body><div class="card"><h1>KARTAR CLASSES APK Builder</h1><p class="small">Name and logo preview form. Android launcher name/icon changes require a new APK build.</p><label>App Name</label><input id="name" value="KARTAR CLASSES DAUDNAGAR"><label>Portal URL</label><input id="url" value="https://klav0628-droid.github.io/student-teacher-portal/"><label>Upload Logo</label><input id="logo" type="file" accept="image/*"><div class="preview"><img id="img"><div><b id="pname">KARTAR CLASSES DAUDNAGAR</b><div class="small" id="purl"></div></div></div><button id="save">Save Branding Settings</button><button id="run">Open APK Build</button><p class="small">The Build button opens the repository's GitHub Actions page. After Actions is enabled, run “Build Kartar Classes APK”.</p></div><script>const n=document.getElementById('name'),u=document.getElementById('url'),f=document.getElementById('logo'),im=document.getElementById('img'),pn=document.getElementById('pname'),pu=document.getElementById('purl');function sync(){pn.textContent=n.value||'KARTAR CLASSES DAUDNAGAR';pu.textContent=u.value}n.oninput=sync;u.oninput=sync;f.onchange=()=>{const x=f.files[0];if(x)im.src=URL.createObjectURL(x)};sync();document.getElementById('save').onclick=()=>{localStorage.setItem('kartar_brand_name',n.value);localStorage.setItem('kartar_portal_url',u.value);alert('Branding settings saved on this device. For launcher changes, build a new APK.');};document.getElementById('run').onclick=()=>location.href='https://github.com/klav0628-droid/student-teacher-portal/actions/workflows/build-apk.yml';</script></body></html>
