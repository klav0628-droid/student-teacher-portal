plugins { id 'com.android.application' }

android {
    namespace 'com.kartar.classes'
    compileSdk 35
    defaultConfig {
        applicationId 'com.kartar.classes'
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}