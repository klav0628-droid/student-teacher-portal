<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}header{background:#fff;padding:16px 24px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;padding:20px;border-radius:14px;margin:14px 0;box-shadow:0 2px 12px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}input,select,textarea{width:100%;padding:11px;margin:6px 0;border:1px solid #ccd3dd;border-radius:8px}button{padding:10px 15px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}.danger{background:#dc2626}.hidden{display:none}.badge{padding:4px 9px;border-radius:20px;background:#eef2ff;font-size:12px}</style></head><body><header><b>Portal</b><button id="logout" class="hidden" onclick="logout()">Logout</button></header><main class="wrap"><section id="auth" class="card"><h2>Login / Register</h2><select id="role"><option value="student">Student</option><option value="teacher">Teacher</option></select><input id="name" placeholder="Full name"><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button onclick="register()">Register</button><button onclick="login()">Login</button><p id="msg"></p></section><section id="app" class="hidden"></section></main><script>
const db=supabase.createClient('https://lchoyvdfclflpbhokvve.supabase.co','sb_publishable_DQYKIWVRBGJgDY4u2vrd3w__mX_7PXR');let me;
const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(x){$('msg').textContent=x}
async function register(){const role=$('role').value,name=$('name').value.trim(),email=$('email').value.trim(),password=$('pass').value;if(!name||!email||!password)return msg('All fields are required.');const {data,error}=await db.auth.signUp({email,password,options:{data:{full_name:name,role}}});if(error)return msg(error.message);if(data.session){await load(data.user);return}msg('Registration successful. If email confirmation is enabled, confirm your email, then Login.');}
async function login(){const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});if(error)return msg(error.message);await load(data.user)}
async function load(u){let {data,error}=await db.from('profiles').select('*').eq('id',u.id).maybeSingle();if(error)return msg(error.message);if(!data){return msg('Profile not found. Please register again.')}me=data;$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');if(me.role==='teacher')teacher();else if(me.role==='admin')admin();else student()}
async function teacher(){const {data:c,error}=await db.from('classrooms').select('*').eq('teacher_id',me.id).order('created_at',{ascending:false});if(error)return $('app').innerHTML='<div class="card">'+esc(error.message)+'</div>';$('app').innerHTML='<h1>Teacher Dashboard</h1><div class="grid"><div class="card"><h3>Create Classroom</h3><input id="cn" placeholder="Class name"><input id="jc" placeholder="Unique join code"><textarea id="cd" placeholder="Description"></textarea><button onclick="createClass()">Create</button></div><div class="card"><h3>Teaching</h3><p>Live Class · Video · Notes/PDF · Assignment · Test · Results</p></div></div><div class="card"><h3>My Classrooms</h3>'+((c||[]).map(x=>'<p><b>'+esc(x.name)+'</b> <span class="badge">'+esc(x.join_code)+'</span></p>').join('')||'None')+'</div><div id="requests" class="card">Loading requests...</div>';requests()}
async function createClass(){const x=await db.from('classrooms').insert({teacher_id:me.id,name:$('cn').value.trim(),join_code:$('jc').value.trim(),description:$('cd').value.trim()});if(x.error)return alert(x.error.message);teacher()}
async function requests(){const {data:c,error}=await db.from('classrooms').select('id,name').eq('teacher_id',me.id);if(error)return $('requests').textContent=error.message;let out='';for(const cl of c||[]){const {data:m}=await db.from('classroom_members').select('*').eq('classroom_id',cl.id);for(const r of m||[])out+='<p><b>'+esc(cl.name)+'</b> — '+esc(r.student_id)+' — <span class="badge">'+esc(r.status)+'</span> '+(r.status==='pending'?'<button onclick="setMember(\''+r.classroom_id+'\',\''+r.student_id+'\',\'approved\')">Approve</button><button class="danger" onclick="setMember(\''+r.classroom_id+'\',\''+r.student_id+'\',\'rejected\')">Reject</button>':'')+'</p>'}$('requests').innerHTML='<h3>Student Requests</h3>'+(out||'No requests')}
async function setMember(c,s,status){const x=await db.from('classroom_members').update({status}).eq('classroom_id',c).eq('student_id',s);if(x.error)alert(x.error.message);requests()}
async function student(){const {data:m,error}=await db.from('classroom_members').select('*').eq('student_id',me.id);if(error)return $('app').innerHTML='<div class="card">'+esc(error.message)+'</div>';$('app').innerHTML='<h1>Student Dashboard</h1><div class="card"><h3>Join Teacher</h3><input id="code" placeholder="Teacher join code"><button onclick="join()">Join</button></div><div class="card"><h3>My Connections</h3>'+((m||[]).map(x=>'<p>Classroom: '+esc(x.classroom_id)+' — <span class="badge">'+esc(x.status)+'</span></p>').join('')||'None')+'</div><div class="grid"><div class="card"><h3>Live Classes</h3><p>Live classes will appear here.</p></div><div class="card"><h3>Videos</h3><p>Recorded videos will appear here.</p></div><div class="card"><h3>Notes / PDFs</h3><p>Notes will appear here.</p></div><div class="card"><h3>Tests / Results</h3><p>Tests and results will appear here.</p></div></div>'}
async function join(){const code=$('code').value.trim();const {data:c,error}=await db.from('classrooms').select('id').eq('join_code',code).maybeSingle();if(error||!c)return alert(error?.message||'Invalid join code');const x=await db.from('classroom_members').upsert({classroom_id:c.id,student_id:me.id,status:'pending'});if(x.error)alert(x.error.message);else alert('Join request sent');student()}
async function admin(){const {data:p,error}=await db.from('profiles').select('*').order('created_at',{ascending:false});if(error)return $('app').innerHTML='<div class="card">'+esc(error.message)+'</div>';$('app').innerHTML='<h1>Admin Dashboard</h1><div class="grid"><div class="card"><h3>Total Users</h3><b>'+((p||[]).length)+'</b></div><div class="card"><h3>Management</h3><p>Users and activity can be managed from here.</p></div></div><div class="card"><h3>Users</h3>'+((p||[]).map(x=>'<p>'+esc(x.full_name)+' — '+esc(x.role)+' — '+esc(x.id)+'</p>').join('')||'None')+'</div>'}
async function logout(){await db.auth.signOut();location.reload()}db.auth.getSession().then(({data})=>data.session&&load(data.session.user));
</script></body></html>
