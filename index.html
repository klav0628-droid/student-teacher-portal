<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#172033;
}

header{
    background:white;
    border-bottom:1px solid #e5e7eb;
    padding:16px 24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:20px;
    font-weight:bold;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:25px;
}

.card{
    background:white;
    border-radius:14px;
    padding:22px;
    margin-bottom:18px;
    box-shadow:0 3px 15px rgba(0,0,0,.07);
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:18px;
}

input,select,textarea{
    width:100%;
    padding:12px;
    margin:7px 0;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:15px;
}

button{
    border:0;
    padding:11px 17px;
    border-radius:8px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    margin:4px;
}

button:hover{
    opacity:.9;
}

.secondary{
    background:#64748b;
}

.danger{
    background:#dc2626;
}

.hidden{
    display:none;
}

.muted{
    color:#667085;
}

.badge{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    background:#eef2ff;
    font-size:13px;
}
</style>
</head>

<body>

<header>
    <div class="logo">Dashboard</div>
    <button id="logoutBtn" class="hidden" onclick="logout()">Logout</button>
</header>

<div class="container">

<!-- LOGIN -->
<section id="auth">

<div class="card">

<h2>Login / Register</h2>

<select id="role">
<option value="student">Student</option>
<option value="teacher">Teacher</option>
</select>

<input id="name" placeholder="Full Name">

<input id="email" type="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button onclick="registerUser()">Register</button>

<button onclick="loginUser()">Login</button>

<p id="message" class="muted"></p>

</div>

</section>


<!-- DASHBOARD -->

<section id="dashboard" class="hidden"></section>

</div>


<script>

/* SUPABASE */

const SUPABASE_URL =
"https://lchoyvdfclflpbhokvve.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DQYKIWVRBGJgDY4u2vrd3w__mX_7PXR";

const db =
supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser=null;


/* REGISTER */

async function registerUser(){

    const role =
    document.getElementById("role").value;

    const name =
    document.getElementById("name").value.trim();

    const email =
    document.getElementById("email").value.trim();

    const password =
    document.getElementById("password").value;

    if(!name || !email || !password){
        return showMessage(
        "Name, email and password required."
        );
    }

    const {data,error} =
    await db.auth.signUp({
        email,
        password
    });

    if(error){
        return showMessage(error.message);
    }

    if(data.user){

        const {error:profileError} =
        await db
        .from("profiles")
        .insert({
            id:data.user.id,
            full_name:name,
            role:role
        });

        if(profileError){
            return showMessage(
            profileError.message
            );
        }
    }

    showMessage(
    "Registration successful. Please login."
    );
}


/* LOGIN */

async function loginUser(){

    const email =
    document.getElementById("email").value.trim();

    const password =
    document.getElementById("password").value;

    const {data,error} =
    await db.auth.signInWithPassword({
        email,
        password
    });

    if(error){
        return showMessage(error.message);
    }

    await loadDashboard(data.user);
}


/* LOAD DASHBOARD */

async function loadDashboard(user){

    const {data,error} =
    await db
    .from("profiles")
    .select("*")
    .eq("id",user.id)
    .single();

    if(error){
        return showMessage(error.message);
    }

    currentUser=data;

    document
    .getElementById("auth")
    .classList.add("hidden");

    document
    .getElementById("dashboard")
    .classList.remove("hidden");

    document
    .getElementById("logoutBtn")
    .classList.remove("hidden");

    if(data.role==="teacher"){
        teacherDashboard();
    }
    else{
        studentDashboard();
    }
}


/* TEACHER */

async function teacherDashboard(){

    const {data:classes} =
    await db
    .from("classrooms")
    .select("*")
    .eq("teacher_id",currentUser.id)
    .order("created_at",{ascending:false});

    let html=`

    <h1>Teacher Dashboard</h1>

    <div class="grid">

    <div class="card">

    <h3>Create Classroom</h3>

    <input id="className"
    placeholder="Class Name">

    <input id="joinCode"
    placeholder="Join Code">

    <input id="classDescription"
    placeholder="Description">

    <button onclick="createClass()">
    Create Classroom
    </button>

    </div>


    <div class="card">

    <h3>Teaching Features</h3>

    <p>Live Class</p>
    <p>Recorded Video</p>
    <p>Notes / PDF</p>
    <p>Assignments</p>
    <p>Tests / Quiz</p>
    <p>Student Results</p>

    </div>

    </div>

    <div class="card">

    <h3>Your Classrooms</h3>

    `;

    if(classes && classes.length){

        classes.forEach(c=>{

            html+=`

            <div class="card">

            <h3>${escapeHTML(c.name)}</h3>

            <p>
            ${escapeHTML(c.description || "")}
            </p>

            <span class="badge">
            Join Code:
            ${escapeHTML(c.join_code)}
            </span>

            <div>

            <button
            onclick="viewStudents('${c.id}')">
            Students
            </button>

            </div>

            </div>

            `;

        });

    }else{

        html+=
        "<p>No classroom created yet.</p>";

    }

    html+=`

    </div>

    <div id="studentRequests"></div>

    `;

    document
    .getElementById("dashboard")
    .innerHTML=html;

    loadRequests();
}


/* CREATE CLASS */

async function createClass(){

    const name =
    document.getElementById("className").value;

    const code =
    document.getElementById("joinCode").value;

    const description =
    document.getElementById("classDescription").value;

    if(!name || !code){
        return alert(
        "Class name and join code required."
        );
    }

    const {error} =
    await db
    .from("classrooms")
    .insert({
        teacher_id:currentUser.id,
        name:name,
        join_code:code,
        description:description
    });

    if(error){
        alert(error.message);
    }else{
        alert("Classroom created.");
        teacherDashboard();
    }
}


/* STUDENT */

async function studentDashboard(){

    const {data:members} =
    await db
    .from("classroom_members")
    .select("*")
    .eq("student_id",currentUser.id);

    let html=`

    <h1>Student Dashboard</h1>

    <div class="card">

    <h3>Join Teacher Classroom</h3>

    <input
    id="teacherCode"
    placeholder="Enter Teacher Join Code">

    <button onclick="joinTeacher()">
    Join
    </button>

    </div>

    <div class="card">

    <h3>My Classrooms</h3>

    `;

    if(members && members.length){

        for(const member of members){

            const {data:classroom} =
            await db
            .from("classrooms")
            .select("*")
            .eq("id",member.classroom_id)
            .single();

            if(classroom){

                html+=`

                <div class="card">

                <h3>
                ${escapeHTML(classroom.name)}
                </h3>

                <p>
                ${escapeHTML(
                classroom.description || ""
                )}
                </p>

                <span class="badge">
                ${escapeHTML(member.status)}
                </span>

                </div>

                `;
            }
        }

    }else{

        html+=
        "<p>No classroom joined yet.</p>";

    }

    html+=`

    </div>

    <div class="grid">

    <div class="card">
    <h3>Live Classes</h3>
    <p>Live classes will appear here.</p>
    </div>

    <div class="card">
    <h3>Videos</h3>
    <p>Recorded classes will appear here.</p>
    </div>

    <div class="card">
    <h3>Notes</h3>
    <p>Notes and PDFs will appear here.</p>
    </div>

    <div class="card">
    <h3>Tests</h3>
    <p>Tests and results will appear here.</p>
    </div>

    </div>

    `;

    document
    .getElementById("dashboard")
    .innerHTML=html;
}


/* JOIN TEACHER */

async function joinTeacher(){

    const code =
    document
    .getElementById("teacherCode")
    .value
    .trim();

    if(!code){
        return alert("Enter join code.");
    }

    const {data:classroom,error} =
    await db
    .from("classrooms")
    .select("id")
    .eq("join_code",code)
    .maybeSingle();

    if(error){
        return alert(error.message);
    }

    if(!classroom){
        return alert("Invalid join code.");
    }

    const {error:joinError} =
    await db
    .from("classroom_members")
    .upsert({
        classroom_id:classroom.id,
        student_id:currentUser.id,
        status:"pending"
    });

    if(joinError){
        alert(joinError.message);
    }else{
        alert("Join request sent.");
        studentDashboard();
    }
}


/* TEACHER REQUESTS */

async function loadRequests(){

    const {data:classes} =
    await db
    .from("classrooms")
    .select("id,name")
    .eq("teacher_id",currentUser.id);

    let html=`

    <div class="card">

    <h3>Student Requests</h3>

    `;

    let found=false;

    for(const c of classes || []){

        const {data:requests} =
        await db
        .from("classroom_members")
        .select("*")
        .eq("classroom_id",c.id);

        for(const r of requests || []){

            found=true;

            html+=`

            <div class="card">

            <p>
            Classroom:
            <b>${escapeHTML(c.name)}</b>
            </p>

            <p>
            Student:
            ${escapeHTML(r.student_id)}
            </p>

            <span class="badge">
            ${escapeHTML(r.status)}
            </span>

            `;

            if(r.status==="pending"){

                html+=`

                <button
                onclick="approveStudent(
                '${r.classroom_id}',
                '${r.student_id}'
                )">

                Approve

                </button>

                <button
                class="danger"
                onclick="rejectStudent(
                '${r.classroom_id}',
                '${r.student_id}'
                )">

                Reject

                </button>

                `;

            }

            html+=`</div>`;

        }
    }

    if(!found){
        html+="<p>No student requests.</p>";
    }

    html+=`</div>`;

    document
    .getElementById("studentRequests")
    .innerHTML=html;
}


/* APPROVE */

async function approveStudent(classroom,student){

    const {error} =
    await db
    .from("classroom_members")
    .update({
        status:"approved"
    })
    .eq("classroom_id",classroom)
    .eq("student_id",student);

    if(error){
        alert(error.message);
    }else{
        loadRequests();
    }
}


/* REJECT */

async function rejectStudent(classroom,student){

    const {error} =
    await db
    .from("classroom_members")
    .update({
        status:"rejected"
    })
    .eq("classroom_id",classroom)
    .eq("student_id",student);

    if(error){
        alert(error.message);
    }else{
        loadRequests();
    }
}


/* VIEW STUDENTS */

async function viewStudents(classroom){

    const {data} =
    await db
    .from("classroom_members")
    .select("*")
    .eq("classroom_id",classroom);

    let text="Students:\\n\\n";

    (data || []).forEach(x=>{
        text+=
        x.student_id+
        " - "+
        x.status+
        "\\n";
    });

    alert(text);
}


/* LOGOUT */

async function logout(){

    await db.auth.signOut();

    location.reload();

}


/* MESSAGE */

function showMessage(text){

    document
    .getElementById("message")
    .textContent=text;

}


/* ESCAPE */

function escapeHTML(text){

    return String(text || "")
    .replace(/[&<>"']/g,function(m){

        return {
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"

        }[m];

    });

}


/* SESSION */

db.auth.getSession()
.then(({data})=>{

    if(data.session){

        loadDashboard(
        data.session.user
        );

    }

});

</script>

</body>
</html>
