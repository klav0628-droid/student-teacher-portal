ween;gap:8px;padding:10px 0}.liveDot{color:#dc2626;font-weight:700}.small{font-size:13px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}@media(max-width:800px){aside{width:70px}.servicegrid{grid-template-columns:repeat(2,1fr)}.main{padding:14px}.nav span{display:none}}@media(max-width:600px){header{height:58px;padding:0 12px}.layout{min-height:calc(100vh - 58px)}aside{position:fixed;bottom:0;left:0;right:0;width:100%;height:64px;z-index:20;display:flex;justify-content:space-around;padding:4px;background:#fff;border-top:1px solid #ddd}.nav{margin:0;font-size:11px;padding:5px}.main{padding:10px 10px 78px}.service{min-height:125px;padding:16px 8px;font-size:14px}.icon{font-size:32px;margin-bottom:10px}.topcard,.card{padding:13px}.video{max-height:55vh}input,select,textarea{font-size:16px}}@media(min-width:601px){aside{position:sticky;top:70px;height:calc(100vh - 70px)}} </style></head><body>
<header><div class="brand">Portal</div><div><span id="userName" class="muted"></span><button id="logout" class="hidden" onclick="logout()">Logout</button></div></header>
<div id="auth" class="login topcard"><h2>Login / Register</h2><select id="role"><option value="student">Student</option><option value="teacher">Teacher</option></select><input id="name" placeholder="Full name"><input id="phone" placeholder="Mobile number"><input id="email" type="email" placeholder="Email address"><input id="pass" type="password" placeholder="Password (6+ characters)"><button onclick="register()">Register</button><button onclick="login()">Login</button><p id="msg"></p></div>

let me,session;const peers=new Map();let localStream=null,recorder=null,recordChunks=[],liveChannel=null;const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(x){const el=$('msg');if(el)el.textContent=String(x)}
function bindAuthButtons(){const buttons=document.querySelectorAll('#auth button');if(buttons[0])buttons[0].onclick=()=>register();if(buttons[1])buttons[1].onclick=()=>login()}

async function register(){let role=$('role').value,name=$('name').value.trim(),phone=$('phone').value.trim(),email=$('email').value.trim().toLowerCase(),password=$('pass').value;if(!name||!email||password.length<6)return msg('Name, email and 6+ character password are required.');msg('Creating account...');let {data,error}=await db.auth.signUp({email,password,options:{data:{full_name:name,role,phone}}});if(error)return msg('Register error: '+error.message);if(data.user&&!data.session){msg('Account created successfully. Email confirmation required before first login.');return}if(data.session)await load(data.user);else msg('Registration completed. Please Login.')}
async function login(){let email=$('email').value.trim().toLowerCase(),password=$('pass').value;if(!email||!password)return msg('Enter email and password.');msg('Logging in...');let {data,error}=await db.auth.signInWithPassword({email,password});if(error){let em=error.message||'Login failed';if(em.toLowerCase().includes('email not confirmed'))return msg('Email confirm nahi hua. Supabase me email confirm karein.');return msg('Login error: '+em)}await load(data.user)}
async function load(u){let {data,error}=await db.from('profiles').select('*').eq('id',u.id).maybeSingle();if(error)return msg('Profile read error: '+error.message);if(!data){let meta=u.user_metadata||{};let ins=await db.from('profiles').upsert({id:u.id,full_name:meta.full_name||u.email?.split('@')[0]||'User',email:u.email,role:meta.role||'student',phone:meta.phone||''},{onConflict:'id'}).select().maybeSingle();if(ins.error)return msg('Profile setup failed: '+ins.error.message);data=ins.data||{id:u.id,full_name:meta.full_name||'User',email:u.email,role:meta.role||'student'}}me=data;session=u;$('auth').classList.add('hidden');$('portal').classList.remove('hidden');$('logout').classList.remove('hidden');$('userName').textContent=data.full_name||data.email;home()}
db.auth.onAuthStateChange(async(event,s)=>{if(s?.user && !me) await load(s.user);});
(async()=>{let {data}=await db.auth.getSession();if(data.session&&!me) await load(data.session.user)})();
function home(){let services=[['🔴','Live Class','s1','live'],['🎥','Recording','s2','record'],['₹','Fees','s3','fees'],['📚','Study Material','s4','material'],['📝','Test','s5','test'],['💬','Chat','s6','chat'],['📋','Homework','s7','homework'],['🎧','Help','s8','help']];$('view').innerHTML='<div class="topcard"><div class="livebar"><div><h2 style="margin:0">'+esc(me.full_name)+'</h2><p class="muted">'+esc(me.role)+' dashboard</p></div><span class="badge">'+esc(me.role)+'</span></div></div><div class="servicegrid">'+services.map(x=>'<button class="service '+x[2]+'" onclick="openTab(\''+x[3]+'\')"><span class="icon">'+x[0]+'</span>'+x[1]+'</button>').join('')+'</div><div id="homeFeed"></div>';me.role==='teacher'?teacherHome():studentHome()}
async function teacherHome(){let {data:c}=await db.from('classrooms').select('*').eq('teacher_id',me.id);$('homeFeed').innerHTML='<h2>My Classes</h2><div class="grid"><div class="card"><h3>Create Classroom</h3><input id="cn" placeholder="Class name"><textarea id="cd" placeholder="Description"></textarea><button onclick="createClass()">Create</button></div>'+((c||[]).map(x=>'<div class="card"><h3>'+esc(x.name)+'</h3><p>'+esc(x.description||'')+'</p><span class="badge">Teacher email: '+esc(me.email)+'</span><div><button onclick="requests(\''+x.id+'\')">Students</button><button onclick="teacherLive(\''+x.id+'\')">Start Live</button><button onclick="teacherFees(\''+x.id+'\')">Fees</button><button onclick="teacherMaterial(\''+x.id+'\')">Study Material</button><button onclick="teacherTest(\''+x.id+'\')">Create Test</button><button onclick="teacherHomework(\''+x.id+'\')">Homework</button><button onclick="teacherHelp()">Help Details</button></div></div>').join('')||'')+'</div>'}
async function studentHome(){let {data:m}=await db.from('classroom_members').select('*,classrooms(name,teacher_id)').eq('student_id',me.id).eq('status','approved');$('homeFeed').innerHTML='<h2>My Learning</h2><div class="card"><h3>Connect with Teacher by Email</h3><input id="teacherEmail" type="email" placeholder="Teacher email ID"><button type="button" id="findTeacherBtn" onclick="window.findTeacher()">Find Teacher</button><div id="teacherClasses"></div></div><div class="card"><h3>My Classes</h3>'+((m||[]).map(x=>'<p>📚 '+esc(x.classrooms?.name||'Class')+' <span class="badge">Connected</span></p>').join('')||'No approved class yet')+'</div>';let btn=$('findTeacherBtn');if(btn){btn.addEventListener('click',function(ev){ev.preventDefault();ev.stopPropagation();findTeacher()})}}
async function findTeacher(){let email=$('teacherEmail').value.trim().toLowerCase();if(!email)return alert('Teacher email डालें');$('teacherClasses').innerHTML='<p>Teacher खोज रहे हैं...</p>';let {data,error}=await db.rpc('find_teacher_by_email',{p_email:email});if(error){alert('Teacher search error: '+error.message);return}let teacher=data?.[0];if(!teacher){$('teacherClasses').innerHTML='<p>❌ Teacher नहीं मिला। Email: '+esc(email)+'</p>';return}let rows=(data||[]).filter(x=>x.class_id);$('teacherClasses').innerHTML='<h4>Teacher: '+esc(teacher.teacher_name||teacher.teacher_email)+'</h4><p>'+esc(teacher.teacher_email)+'</p>'+(rows.length?'<h4>Available Classes</h4>'+rows.map(c=>'<div class="card"><b>'+esc(c.class_name)+'</b><p>'+esc(c.class_description||'')+'</p><button onclick="requestJoin(\''+c.class_id+'\')">Join Class</button></div>').join(''):'<p>Teacher मिल गया, लेकिन अभी कोई class नहीं बनाई गई है।')}window.findTeacher=findTeacher;
async function requestJoin(cid){let x=await db.from('classroom_members').upsert({classroom_id:cid,student_id:me.id,status:'pending'});if(x.error)alert(x.error.message);else alert('Join request sent to teacher');studentHome()}
async function createClass(){let name=$('cn').value.trim();if(!name)return alert('Class name required');let x=await db.from('classrooms').insert({teacher_id:me.id,name,description:$('cd').value.trim(),join_code:crypto.randomUUID().slice(0,8)});if(x.error)alert(x.error.message);else home()}
async function requests(cid){let {data:m,error}=await db.from('classroom_members').select('*').eq('classroom_id',cid);if(error)return alert(error.message);$('view').innerHTML='<h2>Student Requests</h2><div class="card">'+((m||[]).map(x=>'<p>'+esc(x.student_id)+' — <span class="badge">'+esc(x.status)+'</span> '+(x.status==='pending'?'<button class="green" onclick="member(\''+cid+'\',\''+x.student_id+'\',\'approved\')">Approve</button><button class="danger" onclick="member(\''+cid+'\',\''+x.student_id+'\',\'rejected\')">Reject</button>':'')+'</p>').join('')||'No requests')+'</div>'}
async function member(c,s,status){let x=await db.from('classroom_members').update({status}).eq('classroom_id',c).eq('student_id',s);if(x.error)alert(x.error.message);requests(c)}
async function teacherLive(cid){let title=prompt('Live class title','Live Class');if(!title)return;let {data,error}=await db.from('live_classes').insert({classroom_id:cid,teacher_id:me.id,title,is_live:false}).select().single();if(error)return alert(error.message);await startTeacherLive(data)}
async function startTeacherLive(live){try{localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true})}catch(e){return alert('Camera/Microphone permission required: '+e.message)}let {data:s,error}=await db.from('live_sessions').insert({live_class_id:live.id,teacher_id:me.id,active:true}).select().single();if(error)return alert(error.message);await db.from('live_classes').update({is_live:true}).eq('id',live.id);renderTeacherLive(live,s);liveCurrentId=live.id;liveChannel=db.channel('live-session-'+s.id,{config:{broadcast:{self:false}}});liveChannel.on('broadcast',{event:'join'},async ({payload})=>{await makeOffer(payload.studentId,s.id)}).on('broadcast',{event:'answer'},async ({payload})=>{let p=peers.get(payload.studentId);if(p)await p.setRemoteDescription(payload.answer)}).on('broadcast',{event:'ice'},async ({payload})=>{let p=peers.get(payload.studentId);if(p&&payload.candidate)try{await p.addIceCandidate(payload.candidate)}catch(e){}}).subscribe();localStream.getTracks().forEach(t=>{});startRecording(s.id);function renderTeacherLive(live,s){$('view').innerHTML='<div class="topcard"><div class="livebar"><h2><span class="liveDot">● LIVE</span> '+esc(live.title)+'</h2><button class="danger" onclick="stopTeacherLive(\''+live.id+'\',\''+s.id+'\')">End Live</button></div><div style="position:relative"><video id="teacherVideo" class="video" autoplay muted playsinline></video><button onclick="toggleFull(\'teacherVideo\')" style="position:absolute;right:12px;bottom:12px;background:#111">⛶ Full Screen</button></div><p id="viewerCount" class="muted">Waiting for students…</p></div>';$('teacherVideo').srcObject=localStream}}
async function makeOffer(studentId,sid){let pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});peers.set(studentId,pc);localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.onicecandidate=e=>{if(e.candidate)liveChannel.send({type:'broadcast',event:'ice',payload:{studentId,candidate:e.candidate}})};let offer=await pc.createOffer();await pc.setLocalDescription(offer);await liveChannel.send({type:'broadcast',event:'offer',payload:{studentId,offer:pc.localDescription}})}
async function startRecording(sid){recordChunks=[];try{recorder=new MediaRecorder(localStream,{mimeType:'video/webm'});recorder.ondataavailable=e=>e.data.size&&recordChunks.push(e.data);recorder.onstop=async()=>{let blob=new Blob(recordChunks,{type:'video/webm'});let chapter=prompt('Chapter / Folder name','Chapter 1');if(!chapter)chapter='Chapter 1';let safe=chapter.replace(/[^a-zA-Z0-9_-]/g,'_');let path=liveCurrentId+'/'+safe+'/'+Date.now()+'.webm';let up=await db.storage.from('class-recordings').upload(path,blob,{contentType:'video/webm',upsert:false});if(!up.error){let url=db.storage.from('class-recordings').getPublicUrl(path).data.publicUrl;await db.from('live_sessions').update({recording_url:url,ended_at:new Date().toISOString(),active:false}).eq('id',sid);await db.from('live_classes').update({is_live:false,recording_url:url}).eq('id',liveCurrentId);await db.from('recorded_chapters').insert({classroom_id:live.classroom_id,teacher_id:me.id,title:live.title,chapter_name:chapter,video_url:url,storage_path:path})}};recorder.start(1000)}catch(e){console.warn(e)}}
let liveCurrentId=null;
async function stopTeacherLive(lid,sid){liveCurrentId=lid;if(recorder&&recorder.state!=='inactive')recorder.stop();if(localStream)localStream.getTracks().forEach(t=>t.stop());for(let p of peers.values())p.close();peers.clear();if(liveChannel){await liveChannel.unsubscribe();liveChannel=null}await db.from('live_sessions').update({active:false,ended_at:new Date().toISOString()}).eq('id',sid);await db.from('live_classes').update({is_live:false}).eq('id',lid);home()}
function toggleFull(id){let v=$(id);if(v.requestFullscreen)v.requestFullscreen();else if(v.webkitRequestFullscreen)v.webkitRequestFullscreen()}
async function openTab(tab){let titles={live:'Live Classes',record:'Recorded Classes',fees:'Fees',material:'Study Material',test:'Tests',chat:'Chat',homework:'Homework',help:'Help'};$('view').innerHTML='<div class="topcard"><h2>'+titles[tab]+'</h2></div><div id="tabBody"></div>';let b=$('tabBody');if(tab==='live'){let {data}=await db.from('live_classes').select('*').eq('is_live',true).order('created_at',{ascending:false});b.innerHTML=(data||[]).map(x=>'<div class="card"><div class="livebar"><div><span class="liveDot">● LIVE NOW</span><h3>'+esc(x.title)+'</h3></div><button onclick="joinLive(\''+x.id+'\')">Join Live</button></div></div>').join('')||'<div class="card">No live class currently.</div>';if(me.role==='teacher')b.innerHTML+='<div class="card"><h3>Start a Live Class</h3><p>Choose your classroom from Home → Start Live.</p></div>'}
else if(tab==='record'){let {data,error}=await db.from('recorded_chapters').select('*').order('created_at',{ascending:false});if(error)return b.innerHTML='<div class="card">'+esc(error.message)+'</div>';let groups={};(data||[]).forEach(x=>(groups[x.chapter_name]??=[]).push(x));b.innerHTML=Object.keys(groups).map(ch=>'<div class="card"><h3>📁 '+esc(ch)+'</h3>'+groups[ch].map(x=>'<div class="card"><b>'+esc(x.title)+'</b><video class="video" controls preload="metadata" src="'+esc(x.video_url)+'"></video><a download target="_blank" href="'+esc(x.video_url)+'"><button>⬇ Download</button></a></div>').join('')+'</div>').join('')||'<div class="card">No recorded class yet.</div>'}
else if(tab==='material'){let {data,error}=await db.from('resources').select('*').order('created_at',{ascending:false});if(error)return b.innerHTML='<div class="card">'+esc(error.message)+'</div>';let groups={};(data||[]).forEach(x=>(groups[x.chapter_name||'General']??=[]).push(x));b.innerHTML=Object.keys(groups).map(ch=>'<div class="card"><h3>📁 '+esc(ch)+'</h3>'+groups[ch].map(x=>'<div class="card"><b>'+esc(x.title)+'</b><p>'+esc(x.type)+'</p>'+(x.type==='video'?'<video class="video" controls src="'+esc(x.file_url)+'"></video>':'')+'<a download target="_blank" href="'+esc(x.file_url)+'"><button>⬇ Download / Open</button></a></div>').join('')+'</div>').join('')||'<div class="card">No study material yet.</div>'}
else if(tab==='fees'){let {data}=await db.from('fee_records').select('*').eq(me.role==='student'?'student_id':'teacher_id',me.id).order('created_at',{ascending:false});b.innerHTML=(data||[]).map(x=>'<div class="card"><b>₹ '+esc(x.amount)+'</b> — <span class="badge">'+esc(x.status)+'</span><p>'+esc(x.note||'')+'</p>'+(me.role==='student'&&x.status==='pending'?'<button onclick="requestFee(\''+x.id+'\')">I Have Paid / Request Completion</button>':'')+(me.role==='teacher'&&(x.status==='payment_submitted'||x.status==='pending')?'<button class="green" onclick="completeFee(\''+x.id+'\')">Mark Complete</button>':'')+'</div>').join('')||'<div class="card">No fee records.</div>'}
else if(tab==='test'){let {data}=await db.from('tests').select('*').order('created_at',{ascending:false});b.innerHTML=(data||[]).map(x=>'<div class="card"><b>'+esc(x.title)+'</b><p>'+((x.questions||[]).length)+' questions</p><button onclick="openTest(\''+x.id+'\')">Open Test</button></div>').join('')||'<div class="card">No tests yet.</div>'}
else if(tab==='homework'){let {data}=await db.from('assignments').select('*').order('created_at',{ascending:false});b.innerHTML=(data||[]).map(x=>'<div class="card"><b>'+esc(x.title)+'</b><p>'+esc(x.description||'')+'</p><span class="badge">Due: '+esc(x.due_at||'Not set')+'</span>'+(x.file_url?'<br><a download target="_blank" href="'+esc(x.file_url)+'"><button>⬇ Download Homework</button></a>':'')+'</div>').join('')||'<div class="card">No homework yet.</div>'}else if(tab==='chat')b.innerHTML='<div class="card"><h3>🔒 Private Chat</h3><p class="muted">Messages are visible only to you and the selected teacher/student.</p><button onclick="privateChat()">Open Private Chat</button></div>';else if(tab==='help'){let {data}=await db.from('teacher_help').select('*');b.innerHTML=(data||[]).map(x=>'<div class="card"><h3>Teacher Help</h3><p>📞 <b>'+esc(x.phone)+'</b></p><p>📍 '+esc(x.address)+'</p></div>').join('')||'<div class="card">Help details not added yet.</div>'}else b.innerHTML='<div class="card"><h3>Help</h3><p>Contact your teacher/admin.</p></div>'}
async function joinLive(liveId){let {data:live,error}=await db.from('live_classes').select('*').eq('id',liveId).single();if(error)return alert(error.message);let {data:s,error:e}=await db.from('live_sessions').select('*').eq('live_class_id',liveId).eq('active',true).limit(1).maybeSingle();if(e||!s)return alert('Live session not available.');let {data:m}=await db.from('classroom_members').select('status').eq('classroom_id',live.classroom_id).eq('student_id',me.id).maybeSingle();if(!m||m.status!=='approved')return alert('Teacher must approve your connection first.');$('view').innerHTML='<div class="topcard"><div class="livebar"><h2><span class="liveDot">● LIVE</span> '+esc(live.title)+'</h2><button class="danger" onclick="leaveLive()">Leave</button></div><div style="position:relative"><video id="studentVideo" class="video" autoplay playsinline></video><button onclick="toggleFull(\'studentVideo\')" style="position:absolute;right:12px;bottom:12px;background:#111">⛶ Full Screen</button></div><p class="muted">Connected to teacher live class.</p></div>';let pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});peers.set('student',pc);pc.ontrack=e=>{$('studentVideo').srcObject=e.streams[0]};liveChannel=db.channel('live-session-'+s.id,{config:{broadcast:{self:false}}});liveChannel.on('broadcast',{event:'offer'},async ({payload})=>{if(payload.studentId!==me.id)return;await pc.setRemoteDescription(payload.offer);let answer=await pc.createAnswer();await pc.setLocalDescription(answer);await liveChannel.send({type:'broadcast',event:'answer',payload:{studentId:me.id,answer:pc.localDescription}})}).on('broadcast',{event:'ice'},async ({payload})=>{if(payload.studentId===me.id&&payload.candidate)try{await pc.addIceCandidate(payload.candidate)}catch(e){}}).subscribe();pc.onicecandidate=e=>{if(e.candidate)liveChannel.send({type:'broadcast',event:'ice',payload:{studentId:me.id,candidate:e.candidate}})};await liveChannel.send({type:'broadcast',event:'join',payload:{studentId:me.id}})}
async function leaveLive(){if(liveChannel){await liveChannel.unsubscribe();liveChannel=null}let p=peers.get('student');if(p)p.close();peers.delete('student');home()}
async function openTest(id){let {data:t,error}=await db.from('tests').select('*').eq('id',id).single();if(error)return alert(error.message);let qs=t.questions||[];$('view').innerHTML='<div class="card"><h2>'+esc(t.title)+'</h2>'+qs.map((q,i)=>'<div class="card"><b>'+(i+1)+'. '+esc(q.question||'')+'</b>'+((q.options||[]).map((o,j)=>'<label style="display:block;padding:8px"><input type="radio" name="q'+i+'" value="'+j+'"> '+esc(o)+'</label>').join(''))+'</div>').join('')+'<button onclick="submitTest(\''+t.id+'\')">Submit Test</button></div>'}
async function submitTest(id){let {data:t,error}=await db.from('tests').select('*').eq('id',id).single();if(error)return alert(error.message);let answers=(t.questions||[]).map((q,i)=>{let e=document.querySelector('input[name="q'+i+'"]:checked');return e?Number(e.value):null});let score=(t.questions||[]).reduce((s,q,i)=>s+(answers[i]!==null&&Number(q.correct)===answers[i]?1:0),0);let x=await db.from('test_submissions').insert({test_id:id,student_id:me.id,answers,score}).select().single();if(x.error)return alert(x.error.message);alert('Test submitted. Score: '+score+'/'+(t.questions||[]).length);openTab('test')}
async function teacherTest(){let {data:c}=await db.from('classrooms').select('id,name').eq('teacher_id',me.id);if(!c?.length)return alert('Create a classroom first');let qs=[];let title=prompt('Test title');if(!title)return;let cls=c[0];for(let i=0;i<10;i++){let q=prompt('Question '+(i+1)+' (Cancel to finish)');if(!q)break;let opts=[];for(let j=0;j<4;j++)opts.push(prompt('Option '+String.fromCharCode(65+j),'Option '+(j+1))||'');let correct=Number(prompt('Correct option number 1-4','1'))-1;qs.push({question:q,options:opts,correct})}if(!qs.length)return;let x=await db.from('tests').insert({classroom_id:cls.id,teacher_id:me.id,title,questions:qs});if(x.error)alert(x.error.message);else alert('Test created');openTab('test')}
async function teacherMaterial(){let {data:c}=await db.from('classrooms').select('id,name').eq('teacher_id',me.id);if(!c?.length)return alert('Create a classroom first');let title=prompt('Material title');if(!title)return;let chapter=prompt('Chapter / Folder name','Chapter 1')||'General';let type=prompt('Type: pdf or video','pdf')||'pdf';let input=document.createElement('input');input.type='file';input.accept=type==='video'?'video/*':'.pdf,application/pdf';input.onchange=async()=>{let file=input.files[0];if(!file)return;let path=me.id+'/'+chapter.replace(/[^a-zA-Z0-9_-]/g,'_')+'/'+Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');let up=await db.storage.from('study-material').upload(path,file,{upsert:false});if(up.error)return alert(up.error.message);let url=db.storage.from('study-material').getPublicUrl(path).data.publicUrl;let x=await db.from('resources').insert({classroom_id:c[0].id,teacher_id:me.id,title,type,file_url:url,chapter_name:chapter});if(x.error)alert(x.error.message);else alert('Material uploaded')};input.click()}
async function teacherHomework(){let {data:c}=await db.from('classrooms').select('id,name').eq('teacher_id',me.id);if(!c?.length)return alert('Create a classroom first');let title=prompt('Homework title');if(!title)return;let desc=prompt('Homework description','');let input=document.createElement('input');input.type='file';input.onchange=async()=>{let file=input.files[0];if(!file)return;let path=me.id+'/'+Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');let up=await db.storage.from('homework-files').upload(path,file);if(up.error)return alert(up.error.message);let url=db.storage.from('homework-files').getPublicUrl(path).data.publicUrl;let x=await db.from('assignments').insert({classroom_id:c[0].id,teacher_id:me.id,title,description:desc,file_url:url});if(x.error)alert(x.error.message);else alert('Homework uploaded')};input.click()}
async function teacherFees(){let {data:m}=await db.from('classroom_members').select('student_id,classroom_id').eq('status','approved');if(!m?.length)return alert('No approved students');let ids=m.map(x=>x.student_id);let {data:p}=await db.from('profiles').select('id,full_name,email').in('id',ids);let list=(p||[]).map((x,i)=>(i+1)+'. '+x.full_name+' — '+x.email).join('\\n');let n=prompt('Choose student number:\\n'+list,'1');let student=(p||[])[Number(n)-1];if(!student)return alert('Invalid student');let row=m.find(x=>x.student_id===student.id);let amount=prompt('Fee amount for '+student.full_name);if(!amount)return;let note=prompt('Fee note','Monthly fee');let x=await db.from('fee_records').insert({classroom_id:row.classroom_id,student_id:student.id,teacher_id:me.id,amount:Number(amount),status:'pending',note});if(x.error)alert(x.error.message);else alert('Fee marked pending for '+student.full_name)}
async function teacherHelp(){let phone=prompt('Office mobile number');if(!phone)return;let address=prompt('Full office address','');let x=await db.from('teacher_help').upsert({teacher_id:me.id,phone,address,updated_at:new Date().toISOString()});if(x.error)alert(x.error.message);else alert('Help details saved')}
