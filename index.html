<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}header{background:#fff;padding:16px 24px;border-bottom:1px solid #ddd}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;padding:20px;border-radius:14px;margin:14px 0;box-shadow:0 2px 12px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}input,select{width:100%;box-sizing:border-box;padding:11px;margin:6px 0;border:1px solid #ccd3dd;border-radius:8px}button{padding:10px 15px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}.danger{background:#dc2626}.hidden{display:none}.badge{padding:4px 9px;border-radius:20px;background:#eef2ff;font-size:12px}</style></head><body><header><b>Portal</b><button id="logout" class="hidden" onclick="logout()">Logout</button></header><main class="wrap"><section id="auth" class="card"><h2>Login / Register</h2><select id="role"><option value="student">Student</option><option value="teacher">Teacher</option></select><input id="name" placeholder="Full name"><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button onclick="register()">Register</button><button onclick="login()">Login</button><p id="msg"></p></section><section id="app" class="hidden"></section></main><script>const db=supabase.createClient('https://lchoyvdfclflpbhokvve.supabase.co','sb_publishable_DQYKIWVRBGJgDY4u2vrd3w__mX_7PXR');let me;const $=x=>document.getElementById(x), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function register(){let r=$('role').value,n=$('name').value,e=$('email').value,p=$('pass').value;if(!n||!e||!p)return $('msg').textContent='All fields required';let {data,error}=await db.auth.signUp({email:e,password:p});if(error)return $('msg').textContent=error.message;if(data.user){let x=await db.from('profiles').insert({id:data.user.id,full_name:n,role:r});if(x.error)return $('msg').textContent=x.error.message}$('msg').textContent='Registered. Login now.'}async function login(){let {data,error}=await db.auth.signInWithPassword({email:$('email').value,password:$('pass').value});if(error)return $('msg').textContent=error.message;await load(data.user)}async function load(u){let {data,error}=await db.from('profiles').select('*').eq('id',u.id).single();if(error)return $('msg').textContent=error.message;me=data;$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');if(me.role==='teacher')teacher();else if(me.role==='admin')admin();else student()}async function teacher(){let {data:c}=await db.from('classrooms').select('*').eq('teacher_id',me.id).order('created_at',{ascending:false});$('app').innerHTML='<h1>Teacher Dashboard</h1><div class="grid"><div class="card"><h3>Create Classroom</h3><input id="cn" placeholder="Class name"><input id="jc" placeholder="Join code"><input id="cd" placeholder="Description"><button onclick="createClass()">Create</button></div><div class="card"><h3>Teaching</h3><p>Live class · Video · Notes · Assignment · Test · Results</p></div></div><div class="card"><h3>My Classrooms</h3>'+((c||[]).map(x=>'<p><b>'+esc(x.name)+'</b> <span class="badge">'+esc(x.join_code)+'</span></p>').join('')||'None')+'</div><div id="requests" class="card"><h3>Student Requests</h3>Loading...</div>';requests()}async function createClass(){let x=await db.from('classrooms').insert({teacher_id:me.id,name:$('cn').value,join_code:$('jc').value,description:$('cd').value});alert(x.error?x.error.message:'Created');teacher()}async function requests(){let {data:c}=await db.from('classrooms').select('id,name').eq('teacher_id',me.id),html=[];for(const x of c||[]){let {data:m}=await db.from('classroom_members').select('*').eq('classroom_id',x.id);for(const z of m||[])html.push('<p>'+esc(x.name)+' — '+esc(z.student_id)+' — <span class="badge">'+esc(z.status)+'</span> '+(z.status==='pending'?'<button onclick="approve(\''+z.classroom_id+'\',\''+z.student_id+'\')">Approve</button><button class="danger" onclick="reject(\''+z.classroom_id+'\',\''+z.student_id+'\')">Reject</button>':'')+'</p>')}$('requests').innerHTML='<h3>Student Requests</h3>'+(html.join('')||'No requests')}async function approve(c,s){let x=await db.from('classroom_members').update({status:'approved'}).eq('classroom_id',c).eq('student_id',s);if(x.error)alert(x.error.message);requests()}async function reject(c,s){let x=await db.from('classroom_members').update({status:'rejected'}).eq('classroom_id',c).eq('student_id',s);if(x.error)alert(x.error.message);requests()}async function student(){let {data:m}=await db.from('classroom_members').select('*').eq('student_id',me.id);$('app').innerHTML='<h1>Student Dashboard</h1><div class="card"><h3>Join Teacher</h3><input id="code" placeholder="Teacher join code"><button onclick="join()">Join</button></div><div class="card"><h3>My Connections</h3>'+((m||[]).map(x=>'<p>Classroom: '+esc(x.classroom_id)+' — <span class="badge">'+esc(x.status)+'</span></p>').join('')||'None')+'</div><div class="grid"><div class="card"><h3>Live Classes</h3></div><div class="card"><h3>Videos</h3></div><div class="card"><h3>Notes / PDFs</h3></div><div class="card"><h3>Tests / Results</h3></div></div>'}async function join(){let {data:c,error}=await db.from('classrooms').select('id').eq('join_code',$('code').value.trim()).maybeSingle();if(error||!c)return alert(error?.message||'Invalid join code');let x=await db.from('classroom_members').upsert({classroom_id:c.id,student_id:me.id,status:'pending'});alert(x.error?x.error.message:'Request sent');student()}async function admin(){let {data:p}=await db.from('profiles').select('*').order('created_at',{ascending:false});let {data:a}=await db.from('activity_logs').select('*').order('created_at',{ascending:false}).limit(100);$('app').innerHTML='<h1>Admin Dashboard</h1><div class="grid"><div class="card"><h3>Users</h3><b>'+((p||[]).length)+'</b></div><div class="card"><h3>Activity</h3><b>'+((a||[]).length)+'</b></div></div><div class="card"><h3>Users</h3>'+((p||[]).map(x=>'<p>'+esc(x.full_name)+' — '+esc(x.role)+' — '+esc(x.id)+'</p>').join('')||'None')+'</div><div class="card"><h3>Recent Activity</h3>'+((a||[]).map(x=>'<p>'+esc(x.action)+' — '+esc(x.entity_type||'')+'</p>').join('')||'None')+'</div>'}async function logout(){await db.auth.signOut();location.reload()}db.auth.getSession().then(({data})=>data.session&&load(data.session.user));</script></body></html>
