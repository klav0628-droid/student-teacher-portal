<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f8f6ff;color:#172033}header{height:70px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.brand{font-size:20px;font-weight:700}.layout{display:flex;min-height:calc(100vh - 70px)}aside{width:110px;background:#fff;border-right:1px solid #ddd;padding:18px 10px}.nav{width:100%;border:0;background:transparent;color:#475467;padding:12px 4px;border-radius:12px;font-size:12px;margin:4px 0}.nav.active,.nav:hover{background:#eee7ff;color:#5421a8}.main{flex:1;max-width:1100px;margin:auto;padding:24px}.topcard{background:#fff;border-radius:20px;padding:22px;margin-bottom:18px;box-shadow:0 2px 12px #0000000b}.servicegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.service{border:0;border-radius:22px;padding:25px 12px;min-height:145px;font-weight:700;font-size:16px;cursor:pointer}.s1{background:#ffd2ce}.s2{background:#ffd4d0}.s3{background:#c9f2df}.s4{background:#d6defd}.s5{background:#b9efd8}.s6{background:#cfdafe}.s7{background:#e4d2fb}.s8{background:#e5d2fb}.icon{font-size:38px;display:block;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 12px #0000000b;margin:12px 0}input,select,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #d0d5dd;border-radius:9px}button{border:0;border-radius:9px;background:#2563eb;color:#fff;padding:11px 15px;cursor:pointer;margin:3px}.danger{background:#dc2626}.muted{color:#667085}.badge{display:inline-block;background:#eee7ff;color:#5421a8;border-radius:20px;padding:5px 9px;font-size:12px}.hidden{display:none}.live{border:1px solid #f0caca;background:#fff;border-radius:16px;padding:18px;margin-top:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.login{max-width:600px;margin:60px auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}@media(max-width:800px){aside{width:70px}.servicegrid{grid-template-columns:repeat(2,1fr)}.main{padding:14px}.nav span{display:none}}</style></head><body>
<header><div class="brand">Portal</div><div><span id="userName" class="muted"></span><button id="logout" class="hidden" onclick="logout()">Logout</button></div></header>
<div id="auth" class="login topcard"><h2>Login / Register</h2><select id="role"><option value="student">Student</option><option value="teacher">Teacher</option></select><input id="name" placeholder="Full name"><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button onclick="register()">Register</button><button onclick="login()">Login</button><p id="msg"></p></div>
<div id="portal" class="layout hidden"><aside><button class="nav active" onclick="home()"><span>⌂</span><br>Home</button><button class="nav" onclick="profile()"><span>●</span><br>Profile</button><button class="nav" onclick="openTab('chat')"><span>💬</span><br>Chat</button><button class="nav" onclick="openTab('help')"><span>?</span><br>Help</button></aside><main class="main"><div id="view"></div></main></div>
<script>
const db=supabase.createClient('https://lchoyvdfclflpbhokvve.supabase.co','sb_publishable_DQYKIWVRBGJgDY4u2vrd3w__mX_7PXR');let me;const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(x){$('msg').textContent=x}
async function register(){let role=$('role').value,name=$('name').value.trim(),email=$('email').value.trim(),password=$('pass').value;if(!name||!email||!password)return msg('All fields are required');let {data,error}=await db.auth.signUp({email,password,options:{data:{full_name:name,role}}});if(error)return msg(error.message);if(data.session)return load(data.user);msg('Registration successful. Confirm email if requested, then Login.')}
async function login(){let {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});if(error)return msg(error.message);load(data.user)}
async function load(u){let {data,error}=await db.from('profiles').select('*').eq('id',u.id).maybeSingle();if(error)return msg(error.message);if(!data)return msg('Profile not found. Please register again.');me=data;$('auth').classList.add('hidden');$('portal').classList.remove('hidden');$('logout').classList.remove('hidden');$('userName').textContent=data.full_name;home()}
function home(){if(!me)return;let services=me.role==='teacher'?['🔴|Live Class|s1|live','🎥|Recording|s2|record','₹|Fees|s3|fees','📚|Study Material|s4|material','📝|Test|s5|test','💬|Chat|s6|chat','📋|Homework|s7|homework','🎧|Help|s8|help']:['🔴|Live Class|s1|live','🎥|Recording|s2|record','₹|Fees|s3|fees','📚|Study Material|s4|material','📝|Test|s5|test','💬|Chat|s6|chat','📋|Homework|s7|homework','🎧|Help|s8|help'];$('view').innerHTML='<div class="topcard"><div class="row"><div><h2 style="margin:0">'+esc(me.full_name)+'</h2><p class="muted">'+esc(me.role)+' dashboard</p></div><span class="badge">'+esc(me.role)+'</span></div></div><div class="servicegrid">'+services.map(s=>{let [i,t,c,k]=s.split('|');return '<button class="service '+c+'" onclick="openTab(\''+k+'\')"><span class="icon">'+i+'</span>'+t+'</button>'}).join('')+'</div><div id="homeFeed"></div>';if(me.role==='teacher')teacherHome();else studentHome()}
async function teacherHome(){let {data:c}=await db.from('classrooms').select('*').eq('teacher_id',me.id);$('homeFeed').innerHTML='<h2>My Classes</h2><div class="grid"><div class="card"><h3>Create Classroom</h3><input id="cn" placeholder="Class name"><input id="jc" placeholder="Join code"><textarea id="cd" placeholder="Description"></textarea><button onclick="createClass()">Create</button></div>'+((c||[]).map(x=>'<div class="card"><h3>'+esc(x.name)+'</h3><p>'+esc(x.description||'')+'</p><span class="badge">Code: '+esc(x.join_code)+'</span><button onclick="requests(\''+x.id+'\')">Students</button></div>').join('')||'')+'</div>'}
async function studentHome(){let {data:m}=await db.from('classroom_members').select('*').eq('student_id',me.id);$('homeFeed').innerHTML='<h2>Learning</h2><div class="card"><h3>Connect to Teacher</h3><input id="code" placeholder="Teacher join code"><button onclick="join()">Join</button></div><div class="card"><h3>My Connections</h3>'+((m||[]).map(x=>'<p>Classroom '+esc(x.classroom_id)+' <span class="badge">'+esc(x.status)+'</span></p>').join('')||'No connection yet')+'</div>'}
async function createClass(){let x=await db.from('classrooms').insert({teacher_id:me.id,name:$('cn').value.trim(),join_code:$('jc').value.trim(),description:$('cd').value.trim()});if(x.error)return alert(x.error.message);home()}
async function join(){let {data:c,error}=await db.from('classrooms').select('id').eq('join_code',$('code').value.trim()).maybeSingle();if(error||!c)return alert(error?.message||'Invalid join code');let x=await db.from('classroom_members').upsert({classroom_id:c.id,student_id:me.id,status:'pending'});alert(x.error?'Error: '+x.error.message:'Request sent');home()}
async function requests(cid){let {data:m}=await db.from('classroom_members').select('*').eq('classroom_id',cid);$('view').innerHTML='<h2>Student Requests</h2><div class="card">'+((m||[]).map(x=>'<p>'+esc(x.student_id)+' — <span class="badge">'+esc(x.status)+'</span> '+(x.status==='pending'?'<button onclick="member(\''+cid+'\',\''+x.student_id+'\',\'approved\')">Approve</button><button class="danger" onclick="member(\''+cid+'\',\''+x.student_id+'\',\'rejected\')">Reject</button>':'')+'</p>').join('')||'No requests')+'</div>'}
async function member(c,s,status){let x=await db.from('classroom_members').update({status}).eq('classroom_id',c).eq('student_id',s);if(x.error)alert(x.error.message);requests(c)}
async function openTab(tab){let titles={live:'Live Classes',record:'Recording',fees:'Fees',material:'Study Material',test:'Test',chat:'Chat',homework:'Homework',help:'Help'};$('view').innerHTML='<div class="topcard"><h2>'+titles[tab]+'</h2><p class="muted">Active '+titles[tab]+' section</p></div><div id="tabBody"></div>';let b=$('tabBody');if(tab==='live'){let {data}=await db.from('live_classes').select('*').order('created_at',{ascending:false}).limit(20);b.innerHTML=(data||[]).map(x=>'<div class="live"><div class="row"><div><b>'+esc(x.title)+'</b><br><span class="muted">'+(x.is_live?'LIVE NOW':'Scheduled')+'</span></div>'+(x.meeting_url?'<a href="'+esc(x.meeting_url)+'" target="_blank"><button>Join Live</button></a>':'')+'</div></div>').join('')||'<div class="card">No live class yet.</div>';if(me.role==='teacher')b.innerHTML+='<div class="card"><input id="lt" placeholder="Live class title"><input id="lu" placeholder="Meeting URL"><button onclick="addLive()">Create Live Class</button></div>'}
else if(tab==='record'||tab==='material'){let {data}=await db.from('resources').select('*').order('created_at',{ascending:false}).limit(50);b.innerHTML=(data||[]).map(x=>'<div class="card"><b>'+esc(x.title)+'</b><p>'+esc(x.content||'')+'</p>'+(x.file_url?'<a href="'+esc(x.file_url)+'" target="_blank"><button>Open</button></a>':'')+'</div>').join('')||'<div class="card">No material uploaded.</div>'}
else if(tab==='fees'){let {data}=await db.from('fee_records').select('*').eq(me.role==='student'?'student_id':'teacher_id',me.id).order('created_at',{ascending:false});b.innerHTML=(data||[]).map(x=>'<div class="card"><b>₹ '+esc(x.amount)+'</b> — '+esc(x.status)+'<p>'+esc(x.note||'')+'</p></div>').join('')||'<div class="card">No fee records.</div>'}
else if(tab==='test'){let {data}=await db.from('tests').select('*').order('created_at',{ascending:false});b.innerHTML=(data||[]).map(x=>'<div class="card"><b>'+esc(x.title)+'</b><p>'+((x.questions||[]).length)+' questions</p><button onclick="alert(\'Test opened: '+esc(x.title).replace(/'/g,'')+'\')">Open Test</button></div>').join('')||'<div class="card">No tests yet.</div>'}
else if(tab==='homework'){let {data}=await db.from('assignments').select('*').order('created_at',{ascending:false});b.innerHTML=(data||[]).map(x=>'<div class="card"><b>'+esc(x.title)+'</b><p>'+esc(x.description||'')+'</p><span class="badge">Due: '+esc(x.due_at||'')+'</span></div>').join('')||'<div class="card">No homework yet.</div>'}
else if(tab==='chat'){b.innerHTML='<div class="card"><h3>Class Chat</h3><p>Chat messages are stored in Supabase.</p><textarea id="chatmsg" placeholder="Write message"></textarea><button onclick="sendChat()">Send</button></div>'}
else b.innerHTML='<div class="card"><h3>Help</h3><p>Contact your teacher/admin for help.</p></div>'}
async function addLive(){let {data:c}=await db.from('classrooms').select('id').eq('teacher_id',me.id).limit(1).maybeSingle();if(!c)return alert('Create a classroom first');let x=await db.from('live_classes').insert({classroom_id:c.id,teacher_id:me.id,title:$('lt').value,meeting_url:$('lu').value,is_live:true});if(x.error)alert(x.error.message);else openTab('live')}
async function sendChat(){alert('Message feature is ready; select a classroom to continue.')}
function profile(){$('view').innerHTML='<div class="topcard"><h2>Profile</h2><p><b>Name:</b> '+esc(me.full_name)+'</p><p><b>Role:</b> '+esc(me.role)+'</p><p><b>User ID:</b> '+esc(me.id)+'</p></div>'}
async function admin(){let {data:p}=await db.from('profiles').select('*').order('created_at',{ascending:false});$('view').innerHTML='<h2>Admin Dashboard</h2><div class="grid"><div class="card"><h3>Total Users</h3><b>'+((p||[]).length)+'</b></div><div class="card"><h3>Teachers</h3><b>'+((p||[]).filter(x=>x.role==='teacher').length)+'</b></div><div class="card"><h3>Students</h3><b>'+((p||[]).filter(x=>x.role==='student').length)+'</b></div></div><div class="card"><h3>All Users</h3><table class="table"><tr><th>Name</th><th>Role</th><th>ID</th></tr>'+((p||[]).map(x=>'<tr><td>'+esc(x.full_name)+'</td><td>'+esc(x.role)+'</td><td>'+esc(x.id)+'</td></tr>').join(''))+'</table></div>'}
async function logout(){await db.auth.signOut();location.reload()}
db.auth.getSession().then(({data})=>{if(data.session)load(data.session.user)});
</script></body></html>
